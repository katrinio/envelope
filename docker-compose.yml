services:
  postbox:
    build: .
    restart: unless-stopped

    labels:
      com.katrin.logs.app: "envelope"
      com.katrin.logs.environment: "production"

    ports:
      - "127.0.0.1:8014:8000"
    environment:
      POSTBOX_DATABASE_URL: sqlite+aiosqlite:////data/postbox.db
      POSTBOX_JWT_SECRET_KEY: ${POSTBOX_JWT_SECRET_KEY}
      POSTBOX_REGISTRATION_LIMIT: ${POSTBOX_REGISTRATION_LIMIT:-5}
      POSTBOX_LOG_LEVEL: ${POSTBOX_LOG_LEVEL:-INFO}
      POSTBOX_COOKIE_SECURE: ${POSTBOX_COOKIE_SECURE:-true}
      POSTBOX_DEV_LOGIN: ${POSTBOX_DEV_LOGIN:-false}
      HUB_AUTH_SECRET: ${HUB_AUTH_SECRET}
      HUB_BOT_URL: ${HUB_BOT_URL:-}
      POSTBOX_API_HOST: 0.0.0.0
      POSTBOX_API_RELOAD: "false"
    volumes:
      - ./data:/data
    healthcheck:
      test: curl --fail --silent http://127.0.0.1:8000/api/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
