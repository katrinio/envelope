name: 🚀 Deploy Envelope

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-postbox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail

            cd /home/katrin/projects/postbox

            git fetch origin main
            git reset --hard origin/main

            test -f .env || {
              echo "ERROR: missing .env"
              exit 1
            }

            echo "🔍 Validating production configuration..."
            set -a
            source .env
            set +a

            bash scripts/validate-production-config.sh

            docker compose build postbox
            docker compose run --rm --no-deps postbox /opt/venv/bin/alembic upgrade head
            docker compose up -d --remove-orphans postbox

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8014/api/ready >/dev/null; then
                echo "Postbox deployed successfully"
                docker compose ps
                exit 0
              fi

              sleep 2
            done

            echo "ERROR: health check failed"
            docker compose ps
            docker compose logs --tail=100
            exit 1
